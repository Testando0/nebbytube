<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07040f">
    <title>REDTUBE</title>
    <meta property="og:title" content="REDTUBE">
    <meta property="og:description" content="Baixe suas músicas e vídeos">
    <meta property="og:image" content="/bg.jpg">
    <link rel="icon" href="/bg.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nebula-purple': '#8b5cf6',
                        'nebula-dark': '#1a1a1a',
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen">
    <!-- Fundo -->
    <div class="bg-image" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>
    <canvas id="particles" aria-hidden="true"></canvas>

    <header class="site-header">
        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-col items-center">
                <h1 class="logo text-5xl md:text-6xl text-center mb-3">
                    <i class="fas fa-gem logo-icon"></i><span class="red">RED</span><span class="tube">TUBE</span>
                </h1>
                <p class="tagline text-sm md:text-base uppercase">Baixe suas músicas e vídeos</p>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <section class="mb-12">
            <div class="max-w-2xl mx-auto">
                <div class="search-wrap">
                    <div class="search-inner">
                        <label for="searchInput" class="sr-only">Baixar músicas e vídeos</label>
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Digite aqui..."
                            autocomplete="off"
                            class="search-input"
                        >
                        <button id="searchBtn" class="search-btn">
                            <i class="fas fa-search mr-2"></i>
                            Buscar
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="resultsSection">
            <div id="statusMessage" class="status-text text-center py-12 hidden">
                <i class="fas fa-music"></i>
                <p>Pesquise algo para ver os resultados...</p>
            </div>

            <div id="loadingIndicator" class="hidden flex justify-center py-12">
                <div class="eq" aria-label="Carregando">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div id="errorMessage" class="hidden text-center py-12">
                <p class="text-red-300"><i class="fas fa-exclamation-triangle mr-2"></i> <span id="errorText">Ocorreu um erro, tente novamente...</span></p>
            </div>

            <div id="resultsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7"></div>

            <div id="totalDuration" class="hidden mt-8 text-center text-gray-400"></div>
        </section>
    </main>

    <footer class="site-footer fixed bottom-0 left-0 w-full z-50 py-4">
        <div class="container mx-auto px-4 text-center text-gray-400 text-sm">
            <p>From <a href="https://kuromi-system-tech.onrender.com" target="_blank" rel="noopener">Redzin</a></p>
        </div>
    </footer>

    <script src="./fx.js"></script>
    <script src="./script.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7457319815340424"
     crossorigin="anonymous"></script>
</body>
</html>
